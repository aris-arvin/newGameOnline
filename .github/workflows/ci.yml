name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Balance autobattler + simulation smoke (design prompt §18.6). Fails the
      # build if the deterministic cores crash or the balance guard regresses.
      - name: Balance & simulation smoke
        run: |
          pnpm --filter @pure-galaxy/combat-core run meta -- --runs 60
          pnpm --filter @pure-galaxy/world-core run worldsim -- --seed 7 --ticks 80 --every 80
